<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>數學題庫檢索系統</title>
  <!-- 引入 Markdown 解析器與 MathJax 數學公式渲染器 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background: #f4f6f9; color: #333; }
    h1 { color: #2c3e50; }
    
    /* 篩選區塊樣式 */
    .filter-section { background: white; padding: 18px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .filter-group { margin-bottom: 12px; }
    .filter-title { font-weight: bold; margin-bottom: 6px; color: #444; font-size: 0.95em; }
    
    .tags-container { display: flex; gap: 8px; flex-wrap: wrap; }
    
    /* 按鈕樣式 */
    .btn { padding: 6px 12px; border-radius: 20px; border: 1px solid #ccc; background: #f0f0f0; color: #333; cursor: pointer; font-size: 0.9em; transition: all 0.2s; }
    .btn:hover { background: #e0e0e0; }
    .btn.active { background: #007acc; color: white; border-color: #005999; font-weight: bold; }
    
    /* 概念標籤（複選）特有顏色 */
    .btn-concept { background: #e1f5fe; color: #0288d1; border-color: #b3e5fc; }
    .btn-concept:hover { background: #b3e5fc; }
    .btn-concept.active { background: #0288d1; color: white; border-color: #01579b; }

    .search-box { margin-top: 15px; display: flex; gap: 10px; align-items: center; }
    input[type="text"] { width: 280px; padding: 8px 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; }
    .btn-primary { background-color: #007acc; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .btn-primary:hover { background-color: #005999; }
    .btn-reset { background-color: #78909c; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .btn-reset:hover { background-color: #546e7a; }

    textarea { width: 100%; height: 100px; font-family: monospace; padding: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; margin-top: 10px; }
    
    /* 題目預覽區樣式 */
    .preview-container { margin-top: 25px; }
    .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .card { background: white; border-radius: 8px; padding: 18px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 4px solid #007acc; position: relative; }
    .card-title { font-size: 0.9em; color: #666; margin-bottom: 8px; font-weight: bold; padding-left: 28px; }
    .card-checkbox { position: absolute; top: 18px; left: 15px; width: 18px; height: 18px; cursor: pointer; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.8em; margin-right: 5px; background: #eee; }
    .badge-diff { background: #fff3e0; color: #e65100; }
    .badge-cat { background: #e8f5e9; color: #2e7d32; }
  </style>
</head>
<body>
  <h1>📐 數學題庫檢索系統</h1>
  
  <!-- 三維度交叉篩選區 -->
  <div class="filter-section">
    <!-- 1. 取題來源 -->
    <div class="filter-group">
      <div class="filter-title">📌 取題來源（Source）：</div>
      <div class="tags-container" id="categoryGroup"></div>
    </div>

    <!-- 2. 難易度 -->
    <div class="filter-group">
      <div class="filter-title">⚡ 難易度（Difficulty）：</div>
      <div class="tags-container" id="difficultyGroup"></div>
    </div>

    <!-- 3. 試題內容/概念 (複選 AND 查詢) -->
    <div class="filter-group">
      <div class="filter-title">🏷️ 試題內容/概念（Tags，點擊可多選交叉查詢）：</div>
      <div class="tags-container" id="conceptGroup"></div>
    </div>

    <!-- 關鍵字搜尋與重設 -->
    <div class="search-box">
      <input type="text" id="keyword" placeholder="補充關鍵字搜尋..." onkeyup="if(event.key==='Enter') executeFilter()">
      <button class="btn-primary" onclick="executeFilter()">套用篩選</button>
      <button class="btn-reset" onclick="resetFilters()">重設條件</button>
    </div>
  </div>

  <p><strong>打包輸出語法 (可直接複製貼入 Markdown)：</strong></p>
  <textarea id="output" readonly placeholder="搜尋結果語法會顯示在這裡..."></textarea>
  <br><br>
  <button class="btn-primary" onclick="copyOutput()">複製全部打包語法</button>

  <!-- ✨ 複製選取題目 (含 LaTeX) 按鈕 -->
  <button class="btn-primary" style="background-color: #2e7d32; margin-left: 10px;" onclick="copyPreviewContent()">📋 複製勾選題目 (含 LaTeX)</button>

  <hr style="margin-top: 30px; border: 0; border-top: 1px solid #ddd;">

  <!-- 即時預覽區域 -->
  <div class="preview-container">
    <div class="preview-header">
      <h2>📄 題目即時預覽區</h2>
      <div>
        <label style="cursor: pointer; font-size: 0.95em;">
          <input type="checkbox" id="selectAll" checked onchange="toggleSelectAll(this)"> **全選 / 取消全選**
        </label>
      </div>
    </div>
    <div id="previewList">
      <p style="color: #888;">請點擊篩選條件或按「套用篩選」預覽題目...</p>
    </div>
  </div>

  <script>
    // 資料庫（由 sync.ps1 自動更新）
    const questionBank = [
  { file: "Questions/Q2026-002.md", difficulty: "Medium", categories: ["TRML"], concepts: ["代數", "分式方程式"] },
  { file: "Questions/Q2026-003.md", difficulty: "Medium", categories: ["TRML"], concepts: ["排列組合"] },
  { file: "Questions/Q2026-004.md", difficulty: "Hard", categories: ["TRML"], concepts: ["數論", "質數與完全平方數"] },
  { file: "Questions/Q2026-005.md", difficulty: "Easy", categories: ["TRML"], concepts: ["矩陣", "同餘與週期"] },
  { file: "Questions/Q2026-006.md", difficulty: "Medium", categories: ["TRML"], concepts: ["遞迴與二項式定理", "同餘與週期"] },
  { file: "Questions/Q2026-007.md", difficulty: "Medium", categories: ["教甄"], concepts: ["函數", "函數方程", "迭代技巧"] },
  { file: "Questions/Q2026-008.md", difficulty: "Easy", categories: ["教甄"], concepts: ["函數", "函數方程", "迭代技巧"] },
  { file: "Questions/Q2026-009.md", difficulty: "Medium", categories: ["教甄"], concepts: ["函數", "函數方程", "算幾不等式", "迭代技巧"] },
  { file: "Questions/Q2026-010.md", difficulty: "Medium", categories: ["學科能力競賽"], concepts: ["函數", "函數方程", "迭代技巧"] },
  { file: "Questions/Q2026-011.md", difficulty: "Hard", categories: ["教甄"], concepts: ["函數", "函數方程", "迭代技巧"] },
  { file: "Questions/Q2026-012.md", difficulty: "Hard", categories: ["教甄"], concepts: ["極限", "函數極限"] },
  { file: "Questions/Q2026-013.md", difficulty: "Medium", categories: ["教甄"], concepts: ["微分", "導數定義", "多項式"] },
  { file: "Questions/Q2026-014.md", difficulty: "Medium", categories: ["教甄"], concepts: ["極限", "線性近似", "泰勒展開"] },
  { file: "Questions/Q2026-015.md", difficulty: "Easy", categories: ["教甄"], concepts: ["統計與機率", "假設檢定", "幾何分布"] },
  { file: "Questions/Q2026-016.md", difficulty: "Medium", categories: ["教甄"], concepts: ["數論", "整除性", "階乘"] },
  { file: "Questions/Q2026-017.md", difficulty: "Medium", categories: ["校內學科能力競賽"], concepts: ["平面幾何", "面積比", "三角形面積"] },
  { file: "Questions/Q2026-018.md", difficulty: "Medium", categories: ["AMC"], concepts: ["級數", "整數論", "因數分解"] },
  { file: "Questions/Q2026-019.md", difficulty: "Medium", categories: ["校內學科能力競賽"], concepts: ["平面幾何", "三角函數", "重心與中線"] },
  { file: "Questions/Q2026-020.md", difficulty: "Hard", categories: ["校內學科能力競賽"], concepts: ["不等式", "柯西不等式", "代數證明"] }
];

    // 當前篩選狀態
    let selectedCategory = "ALL";
    let selectedDifficulty = "ALL";
    let selectedConcepts = new Set();

    function initFilterUI() {
      const categories = new Set();
      const difficulties = new Set();
      const concepts = new Set();

      questionBank.forEach(q => {
        if (q.categories) q.categories.forEach(c => categories.add(c));
        if (q.difficulty) difficulties.add(q.difficulty);
        if (q.concepts) q.concepts.forEach(t => concepts.add(t));
      });

      const catContainer = document.getElementById('categoryGroup');
      catContainer.innerHTML = `<button class="btn ${selectedCategory==='ALL'?'active':''}" onclick="setCategory('ALL')">全部來源</button>`;
      categories.forEach(cat => {
        catContainer.innerHTML += `<button class="btn ${selectedCategory===cat?'active':''}" onclick="setCategory('${cat}')">${cat}</button>`;
      });

      const diffContainer = document.getElementById('difficultyGroup');
      diffContainer.innerHTML = `<button class="btn ${selectedDifficulty==='ALL'?'active':''}" onclick="setDifficulty('ALL')">全部難度</button>`;
      difficulties.forEach(diff => {
        diffContainer.innerHTML += `<button class="btn ${selectedDifficulty===diff?'active':''}" onclick="setDifficulty('${diff}')">${diff}</button>`;
      });

      const conContainer = document.getElementById('conceptGroup');
      conContainer.innerHTML = '';
      concepts.forEach(con => {
        const isSelected = selectedConcepts.has(con);
        const btn = document.createElement('button');
        btn.className = `btn btn-concept ${isSelected ? 'active' : ''}`;
        btn.innerText = con;
        btn.onclick = () => toggleConcept(con);
        conContainer.appendChild(btn);
      });

      executeFilter();
    }

    function setCategory(cat) {
      selectedCategory = cat;
      initFilterUI();
    }

    function setDifficulty(diff) {
      selectedDifficulty = diff;
      initFilterUI();
    }

    function toggleConcept(con) {
      if (selectedConcepts.has(con)) {
        selectedConcepts.delete(con);
      } else {
        selectedConcepts.add(con);
      }
      initFilterUI();
    }

    function resetFilters() {
      selectedCategory = "ALL";
      selectedDifficulty = "ALL";
      selectedConcepts.clear();
      document.getElementById('keyword').value = '';
      initFilterUI();
    }

    async function executeFilter() {
      const kw = document.getElementById('keyword').value.trim().toLowerCase();

      const matched = questionBank.filter(q => {
        const matchCat = (selectedCategory === "ALL") || (q.categories && q.categories.includes(selectedCategory));
        const matchDiff = (selectedDifficulty === "ALL") || (q.difficulty === selectedDifficulty);
        const matchConcepts = selectedConcepts.size === 0 || Array.from(selectedConcepts).every(c => q.concepts && q.concepts.includes(c));
        const matchKw = !kw || q.file.toLowerCase().includes(kw) || 
                        (q.concepts && q.concepts.some(c => c.toLowerCase().includes(kw))) ||
                        (q.categories && q.categories.some(cat => cat.toLowerCase().includes(kw)));

        return matchCat && matchDiff && matchConcepts && matchKw;
      });

      // 重設「全選」勾選框
      document.getElementById('selectAll').checked = true;

      // 1. 更新打包語法框
      const lines = matched.map(q => `@import "${q.file}"`).join('\n');
      document.getElementById('output').value = lines || "未找到符合條件的題目";

      // 2. 預覽題目
      const previewList = document.getElementById('previewList');
      previewList.innerHTML = '';

      if (matched.length === 0) {
        previewList.innerHTML = '<p style="color: #888;">未找到符合條件的題目</p>';
        return;
      }

      for (const q of matched) {
        const card = document.createElement('div');
        card.className = 'card';
        
        const catBadges = (q.categories || []).map(c => `<span class="badge badge-cat">📌 ${c}</span>`).join(' ');
        const diffBadge = q.difficulty ? `<span class="badge badge-diff">⚡ ${q.difficulty}</span>` : '';
        const conceptStr = (q.concepts || []).join(', ');

        card.innerHTML = `
          <input type="checkbox" class="card-checkbox q-checkbox" data-file="${q.file}" checked onchange="updateSelectAllStatus()">
          <div class="card-title">
            ${catBadges} ${diffBadge} 
            <span>📂 檔案：${q.file}</span>
            <div style="margin-top: 4px;">🏷️ 概念：${conceptStr || '無'}</div>
          </div>
          <div class="card-body">載入中...</div>
        `;
        previewList.appendChild(card);

        try {
          const res = await fetch(encodeURI('./' + q.file));
          if (!res.ok) throw new Error(`HTTP 錯誤! 狀態碼: ${res.status}`);
          
          let text = await res.text();
          text = text.replace(/^---[\s\S]*?---\n?/, '');

          // 1. 將 Markdown 轉為 HTML 內文
let htmlContent = marked.parse(text);

// 2. 自動將圖片路徑中的 ../images/ 修復為 ./images/，確保網頁能正確讀取
htmlContent = htmlContent.replace(/src="\.\.\/images\//g, 'src="./images/');

card.querySelector('.card-body').innerHTML = htmlContent;
        } catch (e) {
          card.querySelector('.card-body').innerHTML = `<span style="color:red;">⚠️ 讀取失敗 (${e.message})</span>`;
        }
      }

      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
      }
    }

    // 全選 / 取消全選
    function toggleSelectAll(master) {
      const checkboxes = document.querySelectorAll('.q-checkbox');
      checkboxes.forEach(cb => cb.checked = master.checked);
    }

    // 若手動取消勾選某題，自動取消「全選」勾選框
    function updateSelectAllStatus() {
      const checkboxes = document.querySelectorAll('.q-checkbox');
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);
      document.getElementById('selectAll').checked = allChecked;
    }

    function copyOutput() {
      const copyText = document.getElementById("output");
      if (!copyText.value) return;
      copyText.select();
      document.execCommand("copy");
      alert("已成功複製打包語法！");
    }

    // ✨ 僅複製「已勾選」的題目內文 (含 LaTeX)
    async function copyPreviewContent() {
      const selectedCheckboxes = document.querySelectorAll('.q-checkbox:checked');
      
      if (selectedCheckboxes.length === 0) {
        alert('請至少勾選一道題目！');
        return;
      }

      let questionsTextList = [];

      for (const cb of selectedCheckboxes) {
        const filePath = cb.getAttribute('data-file');
        try {
          const res = await fetch(encodeURI('./' + filePath));
          if (!res.ok) continue;
          let text = await res.text();

          // 1. 移除 YAML 前言
          text = text.replace(/^---[\s\S]*?---\n?/, '');

          // 2. 裁切解答與解析區塊
          const splitRegex = /(###?\s*(解答|詳解|解析|答案)|#{1,3}\s*Sol)/i;
          const questionOnly = text.split(splitRegex)[0].trim();

          if (questionOnly) {
            questionsTextList.push(questionOnly);
          }
        } catch (e) {
          console.error(`讀取 ${filePath} 失敗:`, e);
        }
      }

      if (questionsTextList.length === 0) {
        alert('複製失敗，未抓取到題目文字！');
        return;
      }

      const fullTextToCopy = questionsTextList.join('\n\n---\n\n');

      try {
        await navigator.clipboard.writeText(fullTextToCopy);
        alert(`已成功複製 ${questionsTextList.length} 道勾選題目（含 LaTeX）！`);
      } catch (err) {
        const tempTextArea = document.createElement('textarea');
        tempTextArea.value = fullTextToCopy;
        document.body.appendChild(tempTextArea);
        tempTextArea.select();
        document.execCommand('copy');
        document.body.removeChild(tempTextArea);
        alert(`已成功複製 ${questionsTextList.length} 道勾選題目（含 LaTeX）！`);
      }
    }

    window.onload = initFilterUI;
  </script>
</body>
</html>
